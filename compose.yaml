name: lictory

# Everything the applications need in development:
#
#   docker compose up -d     # PostgreSQL, migrations, zero-cache, Mailpit, MinIO
#   bun run dev              # the SPA, API, worker and website on the host
#
# Run `bun install` first: the migrations container uses this checkout's
# node_modules. Production uses deploy/compose.production.yaml; see
# docs/operations/development.md.
#
# Published ports listen on 127.0.0.1 only: these services use well-known
# development credentials. For remote development, set
# LICTORY_DEV_BIND_ADDRESS (in the shell or .env) to the interface to expose.
services:
  # Zero needs PostgreSQL 15+ with logical decoding, enough WAL senders and
  # replication slots, and a superuser connection so it can install the event
  # triggers that replicate schema changes incrementally (without them, every
  # migration resets all synced state).
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: lictory
      POSTGRES_USER: lictory
      POSTGRES_PASSWORD: lictory
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Bounds the WAL a stopped zero-cache can hold back. Past it the slot is
      # invalidated and zero-cache resyncs on its next start.
      - -c
      - max_slot_wal_keep_size=2GB
    ports:
      - "${LICTORY_DEV_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lictory -d lictory"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # zero-cache keeps its client view records and change log in a database of
  # its own (as in production), separate from the application's data. Created
  # here rather than by an init script so existing volumes get it too.
  postgres-setup:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      PGHOST: postgres
      PGUSER: lictory
      PGPASSWORD: lictory
      PGDATABASE: lictory
    command:
      - sh
      - -c
      - >-
        echo "SELECT 'CREATE DATABASE lictory_zero' WHERE NOT EXISTS
        (SELECT FROM pg_database WHERE datname = 'lictory_zero') \gexec"
        | psql -v ON_ERROR_STOP=1 -q
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Applies committed migrations (including the `lictory_zero` publication
  # zero-cache replicates) before zero-cache starts. Re-run after generating a
  # migration with `docker compose run --rm migrate` or `bun run db:migrate`.
  migrate:
    image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    working_dir: /app
    command: ["bun", "scripts/migrate.ts"]
    environment:
      # Set explicitly so values in .env (which point at localhost) are ignored.
      DATABASE_URL: postgresql://lictory:lictory@postgres:5432/lictory
      DATABASE_URL_UNPOOLED: postgresql://lictory:lictory@postgres:5432/lictory
      DATABASE_MIGRATION_TARGET: local
      DATABASE_MIGRATION_URL: ""
    volumes:
      - .:/app:ro
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    restart: "no"

  # Calls the API running on the host (`bun run dev`, port 3002) for synced
  # queries and mutations, forwarding the browser's session cookie.
  zero-cache:
    image: rocicorp/zero:1.11.3@sha256:d1ad384ea14eee10e0a3180a281ef8b943924993c06d8e47a36017b9bdcc7c55
    environment:
      # Direct connection (never through a pooler): it holds the replication slot.
      ZERO_UPSTREAM_DB: postgresql://lictory:lictory@postgres:5432/lictory
      ZERO_CVR_DB: postgresql://lictory:lictory@postgres:5432/lictory_zero
      ZERO_CHANGE_DB: postgresql://lictory:lictory@postgres:5432/lictory_zero
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_APP_PUBLICATIONS: lictory_zero
      ZERO_QUERY_URL: http://host.docker.internal:3002/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3002/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS: "60"
      ZERO_NUM_SYNC_WORKERS: "1"
      ZERO_ADMIN_PASSWORD: development
      ZERO_ENABLE_TELEMETRY: "false"
      ZERO_LOG_LEVEL: warn
      ZERO_LOG_FORMAT: text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LICTORY_DEV_BIND_ADDRESS:-127.0.0.1}:4848:4848"
    volumes:
      - zero_replica:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4848/keepalive').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${LICTORY_DEV_BIND_ADDRESS:-127.0.0.1}:1025:1025"
      - "${LICTORY_DEV_BIND_ADDRESS:-127.0.0.1}:8025:8025"
    restart: unless-stopped

  # Optional local OpenID Connect identity provider for single sign-on work:
  # `docker compose --profile sso up -d dex`. See deploy/dex/development.yaml
  # and docs/operations/sso.md.
  dex:
    profiles: [sso]
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./deploy/dex/development.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped

  # S3-compatible storage for attachments (community-maintained MinIO build;
  # MinIO no longer publishes images). The API signs upload and download URLs
  # for http://127.0.0.1:9000, so browsers on this machine reach it directly;
  # MinIO allows any CORS origin by default. Console: http://127.0.0.1:9001.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: lictory
      MINIO_ROOT_PASSWORD: lictory-development
      MC_HOST_local: http://lictory:lictory-development@localhost:9000
    ports:
      - "${LICTORY_DEV_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${LICTORY_DEV_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Creates the attachment bucket (S3_BUCKET in .env.example) once MinIO is up.
  minio-setup:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    entrypoint: ["mc", "mb", "--ignore-existing", "local/lictory-files"]
    environment:
      MC_HOST_local: http://lictory:lictory-development@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  zero_replica:
  minio_data:
