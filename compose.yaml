name: lictory

# Local development services. The applications run on the host (`bun run dev`);
# see docs/operations/development.md. Production uses deploy/compose.production.yaml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lictory
      POSTGRES_USER: lictory
      POSTGRES_PASSWORD: lictory
    # Zero replicates through logical decoding.
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_slot_wal_keep_size=2GB",
      ]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lictory -d lictory"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Optional: `docker compose --profile zero up -d zero-cache` after
  # `bun run db:migrate` (the lictory_zero publication must exist). Calls the
  # API running on the host at :3002.
  zero-cache:
    image: rocicorp/zero:1.11.2
    profiles: [zero]
    environment:
      ZERO_UPSTREAM_DB: postgresql://lictory:lictory@postgres:5432/lictory
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_APP_PUBLICATIONS: lictory_zero
      ZERO_QUERY_URL: http://host.docker.internal:3002/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3002/api/zero/mutate
      ZERO_QUERY_API_KEY: ${ZERO_API_KEY:-}
      ZERO_MUTATE_API_KEY: ${ZERO_API_KEY:-}
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS: "60"
      ZERO_NUM_SYNC_WORKERS: "1"
      ZERO_ENABLE_TELEMETRY: "false"
      ZERO_LOG_FORMAT: text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4848:4848"
    volumes:
      - zero_replica:/data
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  zero_replica:
