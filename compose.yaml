name: lictory

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lictory
      POSTGRES_USER: lictory
      POSTGRES_PASSWORD: lictory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lictory -d lictory"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      target: development
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-development-secret-change-before-production
      OAUTH_PROXY_URL: ${OAUTH_PROXY_URL:-}
      OAUTH_PROXY_SECRET: ${OAUTH_PROXY_SECRET:-}
      OAUTH_PROXY_TRUSTED_ORIGINS: ${OAUTH_PROXY_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgresql://lictory:lictory@postgres:5432/lictory
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Lictory <no-reply@email.lictory.com>}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Lictory <no-reply@lictory.local>
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    command:
      [
        "sh",
        "-c",
        "bun install --frozen-lockfile && bun run db:migrate && bun run dev --hostname 0.0.0.0",
      ]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  app_node_modules:
