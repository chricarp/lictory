name: Database migrations

# Applies committed migrations to one shared environment. Called by
# "Deploy production" before activation; also dispatchable for staging or to
# retry a failed production run. Never runs for pull requests.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose database to migrate
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    # Serializes workflow runs per environment; scripts/migrate.ts also holds a
    # PostgreSQL advisory lock against any other runner.
    concurrency:
      group: database-migrations-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DATABASE_MIGRATION_TARGET: ${{ inputs.environment }}
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      DATABASE_MIGRATION_EXPECTED_HOST: ${{ vars.DATABASE_MIGRATION_EXPECTED_HOST }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Pending migrations
        run: bun run db:migrate:status
      - name: Apply committed migrations
        run: bun run db:migrate
