name: Database migrations

# Recovery only. Normal releases migrate inside their activation gate. This
# re-runs the locked, transactional runner on the server, from the migrate
# image of a release that is already prepared there (deploy.sh prepare), and
# waits until zero-cache has replicated the change. It never activates an
# application.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to migrate
        required: true
        type: choice
        options: [staging, production]
      version:
        description: "Prepared release version whose migrations to apply, for example 1.5.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.environment == 'production' && 'lictory-production-release' || 'database-migrations-staging' }}
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'production' && 'Production' || inputs.environment }}
    env:
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the deployment server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ci/ssh-setup.sh
      - name: Migrate on the server
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version."; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS_FILE" -i "$DEPLOY_SSH_KEY_FILE" \
            "$DEPLOY_SSH_TARGET" "$TARGET_ENVIRONMENT migrate $RELEASE_VERSION" </dev/null
