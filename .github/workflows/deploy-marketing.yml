name: Deploy marketing website

# lictory.com is not part of the released product: it deploys only to the
# maintainer's Cloudflare account. The Release workflow calls this when the
# site's sources changed or the platform was released (it shows the stable
# version); a release manager can also run it alone to redeploy main.
# Pull requests only build it; there are no previews.
# Setup and rollback: docs/operations/websites.md.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag the site shows; empty for the latest
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer commit waits instead of cancelling it.
concurrency:
  group: website-marketing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy lictory.com
    # Forks have no deployment environment; never try.
    if: github.repository == 'chricarp/lictory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write # Its own deployment journal; no other write access.
    environment:
      name: websites
      url: https://lictory.com
    env:
      SITE_URL: https://lictory.com
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Called from Release or run alone: either way, only a release manager.
      - uses: ./.github/actions/release-manager
        with:
          managers: ${{ vars.RELEASE_MANAGERS || github.repository_owner }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/marketing/.next/cache
          key: next-marketing-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-marketing-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      # The release that called this run, otherwise the latest published
      # stable GitHub Release. Before the first stable release the source
      # version stays.
      - name: Resolve the latest stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$DISPATCHED_TAG" ]; then
            tag="$DISPATCHED_TAG"
          else
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then
            echo "No published stable release; keeping the source version."
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '(.draft == false) and (.prerelease == false)' | grep -qx true
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp the version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/inject-release-version.ts "$VERSION"
      # Public build settings only: they are compiled into the pages.
      - name: Build the static site
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_ANALYTICS_CONSENT: ${{ vars.ANALYTICS_CONSENT }}
        run: bun run --cwd apps/marketing build:cloudflare
      # The only step that receives the Cloudflare token.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          # The Worker relays consented analytics straight to PostHog.
          if [ -n "$POSTHOG_HOST" ]; then
            bun run --cwd apps/marketing deploy:cloudflare --var "POSTHOG_HOST:$POSTHOG_HOST"
          else
            bun run --cwd apps/marketing deploy:cloudflare
          fi
      # The commit this site now serves: the next Release compares against it.
      - name: Record the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(jq -n --arg ref "$GITHUB_SHA" '{ref: $ref, environment: "marketing-site",
            auto_merge: false, required_contexts: [], transient_environment: false,
            description: "https://lictory.com"}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success -f environment_url=https://lictory.com >/dev/null
