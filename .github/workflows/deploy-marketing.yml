name: Deploy marketing website

# lictory.com is not part of the released product: it deploys only to the
# maintainer's Cloudflare account, from main, whenever its sources change, and
# again after each stable release so it shows the new version. Pull requests
# only build it (bun run check, the browser suite); there are no previews.
# Setup and rollback: docs/operations/websites.md.
on:
  push:
    branches: [main]
    paths:
      - apps/marketing/**
      - packages/ui/**
      - packages/core/src/lib/**
      - deploy/cloudflare/**
      - bun.lock
      - package.json
      - .github/workflows/deploy-marketing.yml
  workflow_dispatch:
  repository_dispatch:
    types: [stable-published]

permissions:
  contents: read

# One deployment at a time; a newer commit waits instead of cancelling it.
concurrency:
  group: website-marketing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy lictory.com
    # Forks have no deployment environment; never try.
    if: github.repository == 'chricarp/lictory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: websites
      url: https://lictory.com
    env:
      SITE_URL: https://lictory.com
      NEXT_PUBLIC_PLATFORM_URL: https://app.lictory.com
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/marketing/.next/cache
          key: next-marketing-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-marketing-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      # The release that triggered this run, otherwise the latest published
      # stable GitHub Release. Before the first stable release the source
      # version stays.
      - name: Resolve the latest stable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ -n "$DISPATCHED_TAG" ]; then
            tag="$DISPATCHED_TAG"
          else
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then
            echo "No published stable release; keeping the source version."
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '(.draft == false) and (.prerelease == false)' | grep -qx true
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp the version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/inject-release-version.ts "$VERSION"
      # Public build settings only: they are compiled into the pages.
      - name: Build the static site
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_ANALYTICS_CONSENT: ${{ vars.ANALYTICS_CONSENT }}
          LICTORY_LEGAL_NAME: ${{ vars.LICTORY_LEGAL_NAME }}
          LICTORY_LEGAL_ADDRESS: ${{ vars.LICTORY_LEGAL_ADDRESS }}
          LICTORY_LEGAL_EMAIL: ${{ vars.LICTORY_LEGAL_EMAIL }}
          LICTORY_LEGAL_REGISTRATION: ${{ vars.LICTORY_LEGAL_REGISTRATION }}
        run: bun run --cwd apps/marketing build:cloudflare
      # The only step that receives the Cloudflare token.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          bun run --cwd apps/marketing deploy:cloudflare
