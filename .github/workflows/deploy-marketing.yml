name: Deploy websites to Cloudflare

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag to deploy (for example v0.13.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lictory-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the selected stable frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://lictory.com
      NEXT_PUBLIC_PLATFORM_URL: https://app.lictory.com
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      LICTORY_LEGAL_NAME: ${{ vars.LICTORY_LEGAL_NAME }}
      LICTORY_LEGAL_ADDRESS: ${{ vars.LICTORY_LEGAL_ADDRESS }}
      LICTORY_LEGAL_EMAIL: ${{ vars.LICTORY_LEGAL_EMAIL }}
      LICTORY_LEGAL_REGISTRATION: ${{ vars.LICTORY_LEGAL_REGISTRATION }}
    steps:
      - name: Require dispatch from main and a published stable release
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '(.draft == false) and (.prerelease == false)' | grep -qx true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require released source on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Stamp the selected stable version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: bun scripts/inject-release-version.ts "${RELEASE_TAG#v}"
      - run: bun run --cwd apps/marketing build:cloudflare
      - run: bun run --cwd apps/platform build
        env:
          VITE_SITE_URL: https://lictory.com
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      - name: Deploy both websites
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          bun run --cwd apps/marketing deploy:cloudflare
          bunx wrangler deploy --config apps/platform/wrangler.jsonc
