name: Nightly

# One verified candidate a day, the way T3 Code ships nightlies: the schedule
# builds main when the platform changed since the newest nightly and
# publishes nothing otherwise (website- or docs-only changes included).
# "Run workflow" on main produces one now. Maintenance branches release every
# fix, and a stable publication rebases main's next
# candidate on the new baseline. A candidate is published only after every
# browser workflow passed on its exact source; the Release workflow promotes
# a published nightly, never main HEAD.
on:
  schedule:
    # 03:23 UTC, off the minute GitHub's scheduler is busiest.
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: ["release/*"]
  repository_dispatch:
    types: [stable-published]

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

# Keep every verified candidate in the release queue.
concurrency:
  group: lictory-nightly-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    # Forks can build/test without publishing the operator's release pipeline.
    # A fork that wants its own releases must deliberately adapt this guard.
    if: github.repository == 'chricarp/lictory'
    name: Calculate nightly candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: write # Candidate journal only; no deployment credentials.
    outputs:
      due: ${{ steps.plan.outputs.due }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun run release plan-nightly "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.due == 'true'
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 30
          overwrite: true

  # Every browser workflow, the domain suite and the static checks on the
  # exact candidate with its embedded version, in parallel with the builds.
  verify:
    name: Verify the candidate
    needs: plan
    if: needs.plan.outputs.due == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release_version: ${{ needs.plan.outputs.version }}
      suite: full

  # Stable releases rebuild the same commit with their own version.
  build:
    name: Build native ${{ matrix.architecture }} backend images
    needs: [plan]
    if: needs.plan.outputs.due == 'true'
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read
      packages: write
      pull-requests: read
      actions: read
    env:
      BUILD_ARCHITECTURE: ${{ matrix.architecture }}
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false # Disposable hosted runner; avoid BuildKit shutdown on the critical path.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the selected source on its native architecture
        env:
          NATIVE_BUILD_OUTPUT: ${{ runner.temp }}/${{ matrix.architecture }}.json
        working-directory: control
        run: bun run release build "$RUNNER_TEMP/plan/release-plan.json" ../source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.architecture }}
          path: ${{ runner.temp }}/${{ matrix.architecture }}.json
          retention-days: 2
          overwrite: true

  publish:
    name: Assemble and publish nightly images
    needs: [plan, verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      deployments: write
      packages: write
      # Keyless signatures and artifact attestations of the release images
      # (.github/actions/sign-images); no other job can mint an OIDC token.
      id-token: write
      attestations: write
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble the multi-platform images
        id: assemble
        working-directory: control
        env:
          NATIVE_BUILDS_DIRECTORY: ${{ runner.temp }}/native
        run: bun run release assemble "$RUNNER_TEMP/plan/release-plan.json" ../source
      # Signed before the release is reserved: no published release has
      # unsigned images.
      - uses: ./control/.github/actions/sign-images
        with:
          subjects: ${{ steps.assemble.outputs.subjects }}
      - name: Report the third-party licenses of the release source
        working-directory: source
        # Package manifests only: no code from the release source runs in a
        # job that can sign. --ignore-scripts skips its install scripts, and
        # the control checkout's bunfig and no .env keep a source bunfig
        # preload or .env out of the report process. `env -i` leaves only
        # PATH and HOME, so a registry the source configures can never be
        # sent GH_TOKEN or the job's OIDC request token.
        run: |
          env -i PATH="$PATH" HOME="$HOME" \
            bun install --frozen-lockfile --ignore-scripts
          env -i PATH="$PATH" HOME="$HOME" \
            bun --config=../control/bunfig.toml --no-env-file \
            ../control/scripts/license-report.ts "$RUNNER_TEMP/licenses"
      - name: Publish this exact nightly candidate
        working-directory: control
        env:
          RELEASE_IMAGES: ${{ steps.assemble.outputs.images }}
          LICENSE_REPORT_DIRECTORY: ${{ runner.temp }}/licenses
          NATIVE_BUILDS_DIRECTORY: ${{ runner.temp }}/native
        # Images and a GitHub Release, not a package registry upload.
        run: bun run release publish "$RUNNER_TEMP/plan/release-plan.json" ../source # zizmor: ignore[use-trusted-publishing]

  # The published candidate as an evaluator meets it: deploy/try.sh (anonymous
  # pulls, no root) on this release's own images and compose file, then
  # sign-in, realtime sync and email (tests/try). A failure leaves the
  # prerelease installable for testing but fails this run, and Release only
  # promotes nightlies whose whole run succeeded. Like the other jobs it runs
  # only the workflow's own commit (the candidate planned from GITHUB_SHA) and
  # restores no cached Bun binary.
  trial:
    name: Laptop trial of the published nightly
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          bun-cache: "false"
      - uses: ./.github/actions/trial
        with:
          version: ${{ needs.plan.outputs.version }}
          registry: ${{ vars.IMAGE_REGISTRY }}
