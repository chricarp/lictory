name: Nightly

on:
  push:
    branches: [main, "release/*"]
  repository_dispatch:
    types: [stable-published]

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

# Keep every verified candidate in the release queue.
concurrency:
  group: lictory-nightly-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    # Forks can build/test without publishing the operator's release pipeline.
    # A fork that wants its own releases must deliberately adapt this guard.
    if: github.repository == 'chricarp/lictory'
    name: Calculate nightly candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: write # Candidate journal only; no deployment credentials.
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun run release plan-nightly "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 30
          overwrite: true

  # No re-verification here: the merged PR already passed CI, and the
  # production release verifies the exact candidate before activation.
  # Nightly images are built with the staging origins; they never reach
  # production, which rebuilds the same commit with production origins.
  build:
    name: Build native ARM64 backend images
    needs: [plan]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      deployments: read
      packages: write
      pull-requests: read
      actions: read
    env:
      BUILD_ARCHITECTURE: arm64
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
      SITE_URL: ${{ vars.STAGING_SITE_URL }}
      PLATFORM_URL: ${{ vars.STAGING_PLATFORM_URL }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.STAGING_POSTHOG_PROJECT_TOKEN }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      LICTORY_LEGAL_NAME: ${{ vars.LICTORY_LEGAL_NAME }}
      LICTORY_LEGAL_ADDRESS: ${{ vars.LICTORY_LEGAL_ADDRESS }}
      LICTORY_LEGAL_EMAIL: ${{ vars.LICTORY_LEGAL_EMAIL }}
      LICTORY_LEGAL_REGISTRATION: ${{ vars.LICTORY_LEGAL_REGISTRATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false # Disposable hosted runner; avoid BuildKit shutdown on the critical path.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the selected source on its native architecture
        env:
          NATIVE_BUILD_OUTPUT: ${{ runner.temp }}/arm64.json
        working-directory: control
        run: bun run release build "$RUNNER_TEMP/plan/release-plan.json" ../source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64
          path: ${{ runner.temp }}/arm64.json
          retention-days: 2
          overwrite: true

  deploy:
    name: Assemble and publish nightly images
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      deployments: write
      packages: write
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
      SITE_URL: ${{ vars.STAGING_SITE_URL }}
      PLATFORM_URL: ${{ vars.STAGING_PLATFORM_URL }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.STAGING_POSTHOG_PROJECT_TOKEN }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      LICTORY_LEGAL_NAME: ${{ vars.LICTORY_LEGAL_NAME }}
      LICTORY_LEGAL_ADDRESS: ${{ vars.LICTORY_LEGAL_ADDRESS }}
      LICTORY_LEGAL_EMAIL: ${{ vars.LICTORY_LEGAL_EMAIL }}
      LICTORY_LEGAL_REGISTRATION: ${{ vars.LICTORY_LEGAL_REGISTRATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble and publish this exact nightly candidate
        working-directory: control
        env:
          NATIVE_BUILDS_DIRECTORY: ${{ runner.temp }}/native
        run: bun run release deploy "$RUNNER_TEMP/plan/release-plan.json" ../source

  # Optional: runs the published nightly on the staging server, migrations
  # included. Skipped until the staging environment is configured.
  stage:
    name: Deploy nightly to staging
    needs: [plan, deploy]
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true # Release builds never restore a cached Bun binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
      - name: Trust the staging server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ci/ssh-setup.sh
      - name: Prepare, migrate and activate on staging
        run: bun run release stage "$RUNNER_TEMP/plan/release-plan.json"
