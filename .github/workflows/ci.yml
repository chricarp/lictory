name: CI

# Pull requests get fast, layered feedback:
#
#   Static checks   types, lint, formatting, unused code, migrations (always)
#   Domain tests    bun test against PostgreSQL         (unless prose only)
#   Browser smoke   the @smoke critical journeys        (when apps change)
#
# Every tier is split across parallel jobs so the slowest job, not the sum,
# sets the duration: lint runs as three jobs over disjoint paths, domain test
# files run in parallel, and the full browser suite runs as four shards
# balanced by recorded duration (scripts/e2e-selection.ts), each with two
# Playwright workers. Splitting never narrows what is checked.
#
# .github/scripts/ci-changes.sh decides from the changed paths and fails open.
# The required `Verify` check passes only when every job passed or was
# skipped by that decision. A draft pull request runs only the static checks:
# the tiers it needs wait until it is marked ready for review (which starts a
# new run), and until then `Verify` fails and names them, so a green check
# always means the selected tiers ran. Nightly calls this workflow with `suite: full`
# (every browser workflow) before it publishes a candidate; Release to
# Production re-verifies the exact candidate with its embedded version.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release_version:
        type: string
        default: ""
      suite:
        description: "Browser workflows to run: smoke or full"
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      suite:
        description: "Browser workflows to run"
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ steps.detect.outputs.unit }}
      e2e: ${{ steps.detect.outputs.e2e }}
      audit: ${{ steps.detect.outputs.audit }}
      docs: ${{ steps.detect.outputs.docs }}
      # Drafts defer the domain and browser tiers to ready for review.
      draft: ${{ steps.state.outputs.draft == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # The event carries the pull request as it was when the event was sent.
      # A push followed within seconds by "Ready for review" can leave only
      # the push's run (the newer run of a group replaces the older), whose
      # event still says draft; the state now decides. A re-run reads it again.
      - id: state
        name: Read whether the pull request is a draft now
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if ! draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft) ||
            { [ "$draft" != true ] && [ "$draft" != false ]; }; then
            echo "::warning::Could not read the pull request's draft state; using the event's ($EVENT_DRAFT)."
            draft=$EVENT_DRAFT
          fi
          echo "draft=$draft" | tee -a "$GITHUB_OUTPUT"
      - id: detect
        name: Select suites from the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # Releases, nightlies and manual runs verify everything. Pull
          # requests GitHub cannot list completely (3000+ files) do too.
          if [ "$EVENT" != pull_request ] || [ "${CHANGED:-0}" -ge 3000 ] ||
            ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed"; then
            printf 'unit=true\ne2e=true\naudit=true\ndocs=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          bash .github/scripts/ci-changes.sh < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static checks (${{ matrix.check.name }})
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The lint paths together cover the whole repository: the last group
        # is everything except the first two.
        check:
          - name: types, formatting, unused code, migrations
            group: other
          - name: lint packages/core
            group: lint
            paths: packages/core
          - name: lint apps/platform
            group: lint
            paths: apps/platform
          - name: lint everything else
            group: lint
            paths: . --ignore-pattern packages/core/** --ignore-pattern apps/platform/**
    # Type-aware ESLint peaks near 4 GB on its largest group, above Node's
    # default heap on these runners; one thread per job keeps it within memory.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          release-version: ${{ inputs.release_version }}
      - name: Toolchain
        run: bun scripts/check-toolchain.ts
      # Type-aware rules need the route types Next.js generates (PageProps,
      # RouteContext); locally `bun run typecheck` makes them before lint.
      - name: Generate Next.js route types
        if: matrix.check.group == 'lint'
        run: |
          bun run --cwd apps/marketing next typegen
          bun run --cwd apps/docs next typegen
      - name: Lint ${{ matrix.check.paths }}
        if: matrix.check.group == 'lint'
        env:
          LINT_PATHS: ${{ matrix.check.paths }}
        run: |
          # The ignore patterns are ESLint globs, not the shell's.
          set -f
          # shellcheck disable=SC2086 # several arguments, split on purpose
          bunx eslint $LINT_PATHS
      # Only when dependencies change: a new advisory for an untouched
      # dependency must not block unrelated pull requests. Nightly audits always.
      - name: Dependency audit
        if: matrix.check.group == 'other' && needs.changes.outputs.audit == 'true'
        run: bun audit --audit-level=high
      - name: Types
        if: matrix.check.group == 'other'
        run: bun run typecheck
      - name: Formatting, unused code and PR assets
        if: matrix.check.group == 'other'
        run: bun run check:rest
      - name: Schema changes have committed migrations
        if: matrix.check.group == 'other'
        run: bun run db:check
      - name: Restore the documentation build cache
        if: matrix.check.group == 'other' && needs.changes.outputs.docs == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: next-docs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/**', 'packages/ui/**') }}
          restore-keys: next-docs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Documentation site builds
        if: matrix.check.group == 'other' && needs.changes.outputs.docs == 'true'
        run: bun run --cwd apps/docs build

  domain:
    name: Domain tests
    needs: changes
    if: needs.changes.outputs.unit == 'true' && needs.changes.outputs.draft != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/services
      - uses: ./.github/actions/setup
        with:
          release-version: ${{ inputs.release_version }}
      - name: Committed migrations apply to an empty database
        run: bun run db:migrate
      # Files run in parallel, each in its own module registry and database;
      # recorded durations start the slowest files first. Three processes
      # keep two cores busy while PostgreSQL answers.
      - name: Domain tests
        run: bun test --parallel=3 --timings=scripts/test-timings/domain.json src

  browser:
    name: Browser workflows (${{ inputs.suite || 'smoke' }} ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.draft != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The smoke tier fits one runner; the full suite is split in four.
        shard: ${{ fromJSON(inputs.suite == 'full' && '[1, 2, 3, 4]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/services
        with:
          mailpit: "true"
      - uses: ./.github/actions/setup
        with:
          release-version: ${{ inputs.release_version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: bunx playwright install --with-deps --only-shell chromium
      # Next.js keeps compiled modules between builds of the website and the
      # documentation (its documented CI cache); a miss only costs time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/marketing/.next/cache
            apps/docs/.next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/marketing/**', 'apps/docs/**', 'packages/ui/**', 'packages/core/src/**') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Browser workflows
        env:
          SUITE: ${{ inputs.suite || 'smoke' }}
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if [ "$SUITE" = full ]; then
            bun run test:e2e
          else
            bun run test:e2e --grep @smoke
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}-${{ github.run_attempt }}
          path: /tmp/lictory-playwright-results
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify
    needs: [changes, static, domain, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every selected job ran and passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DRAFT: ${{ needs.changes.outputs.draft }}
          UNIT: ${{ needs.changes.outputs.unit }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "Job results: $RESULTS"
          status=0
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) status=1 ;;
            esac
          done
          # A skip is acceptable only when the changed paths do not need the
          # tier. A draft skips tiers it does need: report that, never success.
          deferred=()
          if [ "$DRAFT" = true ]; then
            [ "$UNIT" != true ] || deferred+=("domain tests")
            [ "$E2E" != true ] || deferred+=("browser smoke workflows")
          fi
          if [ "${#deferred[@]}" -gt 0 ]; then
            tiers=$(printf '%s and ' "${deferred[@]}")
            tiers=${tiers% and }
            message="Draft: $tiers have not run. They run when the pull request is marked ready for review; re-running only this job does not start them."
            echo "::error title=Tests not run on a draft::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            status=1
          fi
          exit "$status"
