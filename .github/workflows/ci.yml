name: CI

# Community pushes verify without cloud credentials. Cloud Nightly verifies its exact candidate.
# Release callers verify the exact candidate source, with its embedded version.
on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release_version:
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}

env:
  DATABASE_URL: postgresql://lictory:lictory@localhost:5432/lictory
  SCHEMA_TEST_DATABASE_URL: postgresql://lictory:lictory@localhost:5432/postgres
  BETTER_AUTH_URL: http://localhost:3001
  BETTER_AUTH_SECRET: ci-only-secret-not-a-production-credential-32
  RESEND_API_KEY: ""
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  NEXT_TELEMETRY_DISABLED: "1"

# The verification sequence runs as parallel jobs; `Verify` passes only when
# every one of them passed, so it stays the single required check.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Embed the selected release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: bun scripts/inject-release-version.ts "$RELEASE_VERSION"
      - run: bun install --frozen-lockfile
      - name: High and critical dependency vulnerabilities
        run: bun audit --audit-level=high
      - run: bun run check
      - name: Schema changes have committed migrations
        run: bun run db:check

  unit:
    name: Domain tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lictory
          POSTGRES_PASSWORD: lictory
          POSTGRES_DB: lictory
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lictory -d lictory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Embed the selected release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: bun scripts/inject-release-version.ts "$RELEASE_VERSION"
      - run: bun install --frozen-lockfile
      - name: Apply committed migrations to disposable CI database
        run: bun run db:migrate
      - name: Domain, storage, authorization and synchronization tests
        run: bun test src

  e2e:
    name: Browser workflows (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lictory
          POSTGRES_PASSWORD: lictory
          POSTGRES_DB: lictory
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lictory -d lictory"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: [1025:1025, 8025:8025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Embed the selected release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: bun scripts/inject-release-version.ts "$RELEASE_VERSION"
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Build production application and verify complete browser workflows
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bun run test:e2e --shard="$SHARD"
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ matrix.shard }}
          path: /tmp/lictory-playwright-results
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: Verify
    needs: [static, unit, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every verification job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
