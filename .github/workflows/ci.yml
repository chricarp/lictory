name: CI

# Pushes to main run this workflow through "Deploy production", which gates
# migrations and activation on it.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lictory
          POSTGRES_PASSWORD: lictory
          POSTGRES_DB: lictory
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lictory -d lictory"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: [1025:1025, 8025:8025]
    env:
      DATABASE_URL: postgresql://lictory:lictory@localhost:5432/lictory
      SCHEMA_TEST_DATABASE_URL: postgresql://lictory:lictory@localhost:5432/postgres
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-only-secret-not-a-production-credential-32
      RESEND_API_KEY: ""
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: High and critical dependency vulnerabilities
        run: bun audit --audit-level=high
      - run: bun run check
      - name: Schema changes have committed migrations
        run: bun run db:check
      - name: Apply committed migrations to disposable CI database
        run: bun run db:migrate
      - name: Domain, storage, authorization and synchronization tests
        run: bun test src
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build production application and verify complete browser workflows
        run: bun run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: /tmp/lictory-playwright-results
          retention-days: 7
          if-no-files-found: ignore
