name: Secret scan

# gitleaks over the commits a pull request adds (a manual run scans the whole
# history). Works on private repositories; findings are printed redacted and
# fail the check. Reviewed false positives are listed in .gitleaksignore.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          if [ -n "$BASE_SHA" ]; then range="--log-opts=$BASE_SHA..HEAD"; fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 ${range:+"$range"} /repo
