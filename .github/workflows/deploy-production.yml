name: Release to Production

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Verified nightly tag; leave empty for the newest eligible nightly"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

# Preserve intentional queued releases instead of replacing the pending run.
concurrency:
  group: lictory-production-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Select verified nightly source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: write # Selection journal only; no production secrets.
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      - name: Require dispatch from protected main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun run release plan-production "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 30
          overwrite: true

  verify:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release_version: ${{ needs.plan.outputs.version }}

  deploy:
    name: Build, migrate, activate and publish stable
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: Production
    permissions:
      contents: write
      deployments: write
      packages: write
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
      SITE_URL: ${{ vars.SITE_URL }}
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      LICTORY_LEGAL_NAME: ${{ vars.LICTORY_LEGAL_NAME }}
      LICTORY_LEGAL_ADDRESS: ${{ vars.LICTORY_LEGAL_ADDRESS }}
      LICTORY_LEGAL_EMAIL: ${{ vars.LICTORY_LEGAL_EMAIL }}
      LICTORY_LEGAL_REGISTRATION: ${{ vars.LICTORY_LEGAL_REGISTRATION }}
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      # Control code comes from protected main. Application code is never main HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: production-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Trust the production server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash control/deploy/ci/ssh-setup.sh
      - name: Allow the server to pull this workflow's private images
        run: |
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GH_TOKEN" | \
            ssh "$DEPLOY_SSH_TARGET" 'production registry-login'
      - name: Release the selected source with the clean stable version
        working-directory: control
        run: bun run release deploy "$RUNNER_TEMP/plan/release-plan.json" ../source
      - name: Remove the temporary registry credential
        if: always()
        run: ssh "$DEPLOY_SSH_TARGET" 'production registry-logout'
