name: Release to Production

# Promotes a published nightly (the newest eligible one, or the tag given) to
# stable and activates it in production. Only release managers can start it:
# the RELEASE_MANAGERS repository variable lists their GitHub logins
# (comma-separated; the repository owner when unset), and the Production
# environment can add required reviewers (people or a team). See
# docs/operations/releases.md#who-can-release.
on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Verified nightly tag; leave empty for the newest eligible nightly"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

# Preserve intentional queued releases instead of replacing the pending run.
concurrency:
  group: lictory-production-release
  cancel-in-progress: false
  queue: max

jobs:
  # Runs before any build minutes or credentials are spent. Re-runs are
  # checked again: a re-run by someone else is that person's release.
  authorize:
    name: Authorize the release manager
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      ACTOR: ${{ github.triggering_actor }}
      MANAGERS: ${{ vars.RELEASE_MANAGERS || github.repository_owner }}
    steps:
      - name: Require a release manager on protected main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Stable releases are dispatched from main, not $GITHUB_REF."
            exit 1
          fi
          for manager in ${MANAGERS//,/ }; do
            if [ "${manager,,}" = "${ACTOR,,}" ]; then
              echo "$ACTOR is a release manager."
              exit 0
            fi
          done
          echo "::error::$ACTOR is not a release manager. The repository owner adds logins to the RELEASE_MANAGERS variable (Settings → Secrets and variables → Actions)."
          exit 1

  plan:
    name: Select verified nightly source
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: write # Selection journal only; no production secrets.
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      - name: Require dispatch from protected main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun run release plan-production "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 30
          overwrite: true

  verify:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release_version: ${{ needs.plan.outputs.version }}

  build:
    name: Build native ${{ matrix.architecture }} backend images
    needs: [plan]
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: Production
    permissions:
      contents: read
      deployments: read
      packages: write
      pull-requests: read
      actions: read
    env:
      BUILD_ARCHITECTURE: ${{ matrix.architecture }}
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      # Control code comes from protected main. Application code is never main HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: production-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false # Disposable hosted runner; avoid BuildKit shutdown on the critical path.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Trust the production server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash control/deploy/ci/ssh-setup.sh
      - name: Build the selected source on its native architecture
        env:
          NATIVE_BUILD_OUTPUT: ${{ runner.temp }}/${{ matrix.architecture }}.json
        working-directory: control
        run: bun run release build "$RUNNER_TEMP/plan/release-plan.json" ../source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.architecture }}
          path: ${{ runner.temp }}/${{ matrix.architecture }}.json
          retention-days: 2
          overwrite: true

  deploy:
    name: Assemble, migrate, activate and publish stable
    needs: [plan, verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: Production
    permissions:
      contents: write
      deployments: write
      packages: write
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_CACHE_REGISTRY: ${{ vars.IMAGE_CACHE_REGISTRY }}
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      # Control code comes from protected main. Application code is never main HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: production-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - run: bun install --frozen-lockfile
        working-directory: control
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Trust the production server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash control/deploy/ci/ssh-setup.sh
      - name: Allow the server to pull this workflow's private images
        run: |
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GH_TOKEN" | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS_FILE" -i "$DEPLOY_SSH_KEY_FILE" \
              "$DEPLOY_SSH_TARGET" 'production registry-login'
      - name: Release the selected source with the clean stable version
        working-directory: control
        env:
          NATIVE_BUILDS_DIRECTORY: ${{ runner.temp }}/native
        run: bun run release deploy "$RUNNER_TEMP/plan/release-plan.json" ../source
      - name: Remove the temporary registry credential
        if: always()
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS_FILE" -i "$DEPLOY_SSH_KEY_FILE" \
            "$DEPLOY_SSH_TARGET" 'production registry-logout'

  websites-build:
    name: Prepare Cloudflare websites
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      release_tag: ${{ format('v{0}', needs.plan.outputs.version) }}
      source_sha: ${{ needs.plan.outputs.sha }}
      prepare_only: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  websites:
    name: Deploy Cloudflare websites
    needs: [plan, deploy, websites-build]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-marketing.yml
    with:
      prepared: true
      release_tag: ${{ format('v{0}', needs.plan.outputs.version) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
