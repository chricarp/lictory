name: Release to Production

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Verified nightly tag; leave empty for the newest eligible nightly"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

# Preserve intentional queued releases instead of replacing the pending run.
concurrency:
  group: lictory-production-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Select verified nightly source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      deployments: write # Selection journal only; no production secrets.
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
    steps:
      - name: Require dispatch from protected main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun run release plan-production "$RUNNER_TEMP/release-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 30
          overwrite: true

  verify:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      release_version: ${{ needs.plan.outputs.version }}

  deploy:
    name: Stage, migrate, activate and publish stable
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      deployments: write
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      RELEASE_BOOTSTRAP_SHA: ${{ vars.RELEASE_BOOTSTRAP_SHA }}
      RELEASE_BOOTSTRAP_VERSION: ${{ vars.RELEASE_BOOTSTRAP_VERSION }}
      RELEASE_BOOTSTRAP_DEPLOYMENT_ID: ${{ vars.RELEASE_BOOTSTRAP_DEPLOYMENT_ID }}
      DATABASE_MIGRATION_TARGET: production
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      DATABASE_MIGRATION_EXPECTED_HOST: ${{ vars.DATABASE_MIGRATION_EXPECTED_HOST }}
    steps:
      # Control code comes from protected main. Application code is never main HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: control/package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: production-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
        working-directory: control
      - run: bun install --frozen-lockfile
        working-directory: source
      - name: Release the selected source with the clean stable version
        working-directory: control
        run: bun run release deploy "$RUNNER_TEMP/plan/release-plan.json" ../source
