name: Data backfill

# Runs a reviewed, idempotent, batched backfill from scripts/backfills outside
# the deployment path. See docs/operations/migrations.md ("Data changes").
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      script:
        description: File name in scripts/backfills, for example 2026-10-work-item-rank.ts
        required: true
        type: string

permissions:
  contents: read

jobs:
  backfill:
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    concurrency:
      group: database-backfill-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DATABASE_MIGRATION_TARGET: ${{ inputs.environment }}
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      DATABASE_MIGRATION_EXPECTED_HOST: ${{ vars.DATABASE_MIGRATION_EXPECTED_HOST }}
      BACKFILL_SCRIPT: ${{ inputs.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run backfill
        shell: bash
        run: |
          [[ "$BACKFILL_SCRIPT" =~ ^[a-z0-9][a-z0-9-]*\.ts$ ]] || { echo "Invalid script name."; exit 1; }
          test -f "scripts/backfills/$BACKFILL_SCRIPT" || { echo "scripts/backfills/$BACKFILL_SCRIPT does not exist on this ref."; exit 1; }
          bun "scripts/backfills/$BACKFILL_SCRIPT"
