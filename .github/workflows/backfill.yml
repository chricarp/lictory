name: Data backfill

# Runs a reviewed, idempotent, batched backfill from scripts/backfills outside
# the deployment path, on the server, with the migrate image of a release that
# is prepared there (the image bundles every backfill of its commit). See
# docs/operations/migrations.md ("Data changes").
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      version:
        description: "Prepared release version that contains the backfill, for example 1.5.0"
        required: true
        type: string
      script:
        description: File name in scripts/backfills, for example 2026-10-work-item-rank.ts
        required: true
        type: string

permissions:
  contents: read

jobs:
  backfill:
    if: inputs.environment != 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ inputs.environment == 'production' && 'Production' || inputs.environment }}
    concurrency:
      group: database-backfill-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_VERSION: ${{ inputs.version }}
      BACKFILL_SCRIPT: ${{ inputs.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the deployment server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: bash deploy/ci/ssh-setup.sh
      - name: Run backfill on the server
        shell: bash
        run: |
          [[ "$BACKFILL_SCRIPT" =~ ^[a-z0-9][a-z0-9-]*\.ts$ ]] || { echo "Invalid script name."; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version."; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS_FILE" -i "$DEPLOY_SSH_KEY_FILE" \
            "$DEPLOY_SSH_TARGET" "$TARGET_ENVIRONMENT backfill $RELEASE_VERSION ${BACKFILL_SCRIPT%.ts}" </dev/null
