name: Workflow lint

# actionlint (syntax, expressions, shellcheck of run steps) and zizmor
# (security: injection, credential persistence, excessive permissions,
# unpinned or impostor actions) for GitHub Actions changes only. Neither needs
# code scanning, so this also runs while the repository is private.
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 does not know the documented concurrency `queue` key
      # used by the release workflows; every other diagnostic stays enabled.
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -ignore 'unexpected key "queue" for "concurrency" section'
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
