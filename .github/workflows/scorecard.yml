name: Scorecard

# OpenSSF Scorecard: supply-chain posture (pinned dependencies, branch
# protection, token permissions, ...). Results go to the Security tab and the
# public Scorecard API, which only accepts public repositories, so the job is
# skipped while the repository is private; see docs/operations/open-source.md
# ("Security scanning"). Runs when main or its protection rules change rather
# than on a schedule, because scheduled events carry no repository payload to
# check. Keep this workflow in the shape Scorecard verifies: no top-level env or
# defaults, and only the allowed actions.
on:
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # Upload results to code scanning.
      id-token: write # Publish results to the Scorecard API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
