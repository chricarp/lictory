name: Scheduled production jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production-jobs
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Advance cycles, resume exports and send queued notifications
        shell: bash
        run: |
          if [ -z "$APP_ORIGIN" ] || [ -z "$CRON_SECRET" ]; then
            echo "Jobs disabled: configure APP_ORIGIN and CRON_SECRET in production-jobs."
            exit 0
          fi
          case "$APP_ORIGIN" in
            https://*) ;;
            *) echo "APP_ORIGIN must use HTTPS."; exit 1 ;;
          esac
          curl --silent --show-error --fail --max-time 120 \
            --retry 2 --retry-delay 10 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_ORIGIN/api/jobs/iterations"
