name: Scheduled production jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-jobs
  cancel-in-progress: false

jobs:
  run:
    if: vars.LICTORY_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production-jobs
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Advance cycles, resume exports and send queued notifications
        shell: bash
        run: |
          if [ -z "$APP_ORIGIN" ] || [ -z "$CRON_SECRET" ]; then
            echo "Jobs disabled: configure APP_ORIGIN and CRON_SECRET in production-jobs."
            exit 0
          fi
          case "$APP_ORIGIN" in
            https://*) ;;
            *) echo "APP_ORIGIN must use HTTPS."; exit 1 ;;
          esac
          status=$(curl --silent --show-error --fail --max-time 120 \
            --retry 2 --retry-delay 10 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --output /tmp/lictory-job-result.json --write-out '%{http_code}' \
            "$APP_ORIGIN/api/jobs/iterations")
          if [ "$status" != "200" ]; then
            echo "Job returned HTTP $status; check origin and deployment protection."
            exit 1
          fi
          cat /tmp/lictory-job-result.json
