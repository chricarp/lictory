name: Sign and attest client downloads
description: >-
  A keyless cosign signature of the client downloads' SHA256SUMS (written
  next to it as SHA256SUMS.sigstore.json, a Sigstore bundle that is attached
  to the release) and a GitHub artifact attestation (SLSA build provenance)
  of every file SHA256SUMS lists, stored in GitHub's attestation API. The job
  needs id-token and attestations write permissions. Operators verify a
  download with gh attestation verify, or SHA256SUMS with cosign verify-blob
  (docs/operations/releases.md#runner-and-desktop-app).

inputs:
  directory:
    description: >-
      The client downloads, with the SHA256SUMS `bun run release clients`
      wrote over them.
    required: true

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.4
    - name: Sign SHA256SUMS with the workflow's identity
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
      # Sigstore's public-good instance, as for the images: a short-lived
      # certificate for this workflow run, recorded in Rekor.
      run: |
        set -euo pipefail
        cosign sign-blob --yes \
          --bundle "$DIRECTORY/SHA256SUMS.sigstore.json" \
          "$DIRECTORY/SHA256SUMS"
    - name: Attest every download
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ${{ inputs.directory }}/SHA256SUMS
        # Files, not images: nothing goes to a registry.
        push-to-registry: "false"
        create-storage-record: "false"
