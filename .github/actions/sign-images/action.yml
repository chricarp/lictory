name: Sign and attest release images
description: >-
  Keyless cosign signatures and GitHub artifact attestations (SLSA build
  provenance) for the multi-platform image digests of one release, stored next
  to the images in the registry. The job needs id-token and attestations
  write permissions and a registry login that can push. Signing an index
  digest also covers the platform images and the BuildKit SBOM and provenance
  attestations the index lists. Operators verify with cosign verify or
  gh attestation verify (docs/operations/releases.md).

inputs:
  subjects:
    description: >-
      JSON object from `bun run release assemble`: for api, proxy, migrate and
      ops, the repository ("name") and index digest ("digest").
    required: true

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.4
    - name: Sign the image digests with the workflow's identity
      shell: bash
      env:
        SUBJECTS: ${{ inputs.subjects }}
      # Sigstore's public-good instance: a short-lived certificate for this
      # workflow run (OIDC), recorded in the Rekor transparency log.
      run: |
        set -euo pipefail
        for name in api proxy migrate ops; do
          reference=$(jq -er --arg name "$name" '.[$name] | "\(.name)@\(.digest)"' <<<"$SUBJECTS")
          cosign sign --yes "$reference"
        done
    # One action call per image: pushing an attestation to the registry
    # takes exactly one subject.
    - name: Attest the api image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ fromJSON(inputs.subjects).api.name }}
        subject-digest: ${{ fromJSON(inputs.subjects).api.digest }}
        push-to-registry: "true"
        # Storage records exist only for organization-owned repositories.
        create-storage-record: "false"
    - name: Attest the proxy image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ fromJSON(inputs.subjects).proxy.name }}
        subject-digest: ${{ fromJSON(inputs.subjects).proxy.digest }}
        push-to-registry: "true"
        create-storage-record: "false"
    - name: Attest the migrate image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ fromJSON(inputs.subjects).migrate.name }}
        subject-digest: ${{ fromJSON(inputs.subjects).migrate.digest }}
        push-to-registry: "true"
        create-storage-record: "false"
    - name: Attest the ops image
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ fromJSON(inputs.subjects).ops.name }}
        subject-digest: ${{ fromJSON(inputs.subjects).ops.digest }}
        push-to-registry: "true"
        create-storage-record: "false"
