name: Laptop trial
description: >-
  Runs deploy/try.sh from the checkout against a published release (as an
  evaluator does, without root and without a registry login), signs the
  administrator in through a browser, checks realtime sync and email
  (tests/try), then removes the trial. Runs after actions/checkout and
  ./.github/actions/setup.

inputs:
  version:
    description: "Release to try (empty: the newest stable release)"
    default: ""
  registry:
    description: "Registry the release's images are in (empty: try.sh's default)"
    default: ""

runs:
  using: composite
  steps:
    - name: Start the trial
      shell: bash
      env:
        LICTORY_VERSION: ${{ inputs.version }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        [ -z "$REGISTRY" ] || export LICTORY_IMAGE_REGISTRY="$REGISTRY"
        password="$(openssl rand -hex 16)"
        echo "::add-mask::$password"
        echo "LICTORY_TRY_PASSWORD=$password" >> "$GITHUB_ENV"
        export LICTORY_TRY_DIR="$RUNNER_TEMP/lictory-try" LICTORY_ADMIN_PASSWORD="$password"
        echo "LICTORY_TRY_DIR=$LICTORY_TRY_DIR" >> "$GITHUB_ENV"
        # Piped, exactly as the documentation tells people to run it.
        sh < deploy/try.sh
        port=$(grep -E '^HTTP_PORT=' "$LICTORY_TRY_DIR/.env" | tail -n 1 | cut -d= -f2-)
        mail=$(grep -E '^LICTORY_TRY_MAIL_PORT=' "$LICTORY_TRY_DIR/.env" | tail -n 1 | cut -d= -f2-)
        url=http://localhost
        [ "$port" = 80 ] || url="$url:$port"
        {
          echo "LICTORY_TRY_URL=$url"
          echo "LICTORY_TRY_MAIL_URL=http://localhost:$mail"
          echo "LICTORY_TRY_EMAIL=admin@example.com"
        } >> "$GITHUB_ENV"
    - name: Install the browser
      shell: bash
      run: bunx playwright install --with-deps --only-shell chromium
    - name: Sign in, sync and email
      shell: bash
      run: bunx playwright test --config tests/try/playwright.config.ts
    - name: Service logs
      if: failure()
      shell: bash
      run: |
        [ -d "${LICTORY_TRY_DIR:-}" ] || exit 0
        cat "$LICTORY_TRY_DIR/try.log" || true
        cd "$LICTORY_TRY_DIR"
        docker compose ps -a || true
        docker compose logs --no-color --tail 200 || true
    # The documented removal: nothing may be left behind.
    - name: Remove the trial
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        [ -d "${LICTORY_TRY_DIR:-}" ] || exit 0
        (cd "$LICTORY_TRY_DIR" && docker compose down --volumes --rmi all)
        rm -rf "$LICTORY_TRY_DIR"
        left=$(docker ps -aq --filter label=com.docker.compose.project=lictory-try)
        [ -z "$left" ] || { echo "Containers of the trial remain: $left" >&2; exit 1; }
        left=$(docker volume ls -q --filter label=com.docker.compose.project=lictory-try)
        [ -z "$left" ] || { echo "Volumes of the trial remain: $left" >&2; exit 1; }
