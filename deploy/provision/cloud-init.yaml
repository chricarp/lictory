#cloud-config
# Minimal first-boot configuration for a Lictory server (Ubuntu 24.04 LTS).
# Paste as user data when creating the server; replace the SSH key. It only
# creates the administrator and locks down root/password login. Everything else
# is done by deploy/provision/provision.sh, which is idempotent and re-runnable.
users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA-replace-with-the-operator-key operator@example
disable_root: true
ssh_pwauth: false
package_update: true
package_upgrade: true
timezone: UTC
